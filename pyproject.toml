[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nano-dataset"
version = "0.1.0"
description = "Episode datasets with an extensible observation dict"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nano_dataset"]

[tool.hatch.build.targets.sdist]
include = ["/src/nano_dataset", "/pyproject.toml", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pip-audit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "PIE", "RUF", "T201", "PLC0415"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Episode tensors stay on CPU. Do not pull a CUDA wheel for storage.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "nano_dataset/THIRD_PARTY_NOTICES.md"
